name: CI

on:
  push:
    branches: [main, initial-coding]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup tools
        uses: jdx/mise-action@v2

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true # Don't fail if Codecov token is not set

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup tools
        uses: jdx/mise-action@v2

      - name: golangci-lint
        run: make lint

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup tools
        uses: jdx/mise-action@v2

      - name: Build binary
        run: make build

      - name: Build Docker image
        run: docker build -f deployments/docker/Dockerfile -t est-service:test .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: est-service-binary
          path: bin/est-service
          retention-days: 7

