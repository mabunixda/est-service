name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test-unit:
    if: github.event_name == 'pull_request'
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: make test-unit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-unit
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true # Don't fail if Codecov token is not set

  test-integration:
    if: github.event_name == 'pull_request'
    name: Integration Tests
    runs-on: ubuntu-latest
    # Note: Uses OpenBao for integration testing (open-source alternative to OpenBao)
    env:
      BAO_DEV_ROOT_TOKEN_ID: "root-token"
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      BAO_SKIP_VERIFY: "true"

    services:
      openbao:
        image: quay.io/openbao/openbao:latest
        env:
          BAO_ADDR: "http://${{ env.BAO_DEV_LISTEN_ADDRESS }}"
          SKIP_SETCAP: true
          BAO_DEV_ROOT_TOKEN_ID: "${{ env.BAO_DEV_ROOT_TOKEN_ID }}"
          BAO_DEV_LISTEN_ADDRESS: "${{ env.BAO_DEV_LISTEN_ADDRESS }}"
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Wait for OpenBao
        run: |
          echo "Waiting for OpenBao is ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8200/v1/sys/health >/dev/null 2>&1; then
              echo "OpenBao is ready"
              exit 0
            fi
            echo "Waiting for OpenBao... ($i/30)"
            sleep 2
          done
          echo "OpenBao failed to start"
          exit 1

      - name: Setup integration tests backend
        env:
          BACKEND_ADDR: http://localhost:8200
          BACKEND_TOKEN: ${{ env.BAO_DEV_ROOT_TOKEN_ID }}
          ENABLE_CERT_AUTH: "true"
        run: test/scripts/setup_backend.sh

      - name: Run integration tests
        env:
          BAO_ADDR: http://localhost:8200
          BAO_TOKEN: ${{ env.BAO_DEV_ROOT_TOKEN_ID }}
        run: make test-integration

      - name: Upload integration test coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage_integration.out
          flags: integration
          name: codecov-integration
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true # Don't fail if Codecov token is not set

  lint:
    if: github.event_name == 'pull_request'
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: golangci-lint
        run: make lint


  build:
    name: Building
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Setup tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Run
        id: build_prepare
        run: |
          runTarget=snapshot
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            runTarget=release
          fi
          echo BUILD_FLAGS="$runTarget"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: ${{ steps.build_prepare.outputs.BUILD_FLAGS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
    needs: 
      - build
      - test-integration
      - test-unit
      - lint

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic Release
        uses: go-semantic-release/action@v1
        id: semrel
        with:
          allow-initial-development-versions: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          changelog-generator-opt: "emojis=true"
          changelog-file: CHANGELOG.md