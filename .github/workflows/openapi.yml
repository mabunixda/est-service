---
name: OpenAPI Validation

on:
  push:
    branches: [main]
    paths:
      - "docs/swagger.*"
  pull_request:
    branches: [main]
    paths:
      - "docs/swagger.*"

jobs:
  openapi-validate:
    name: Validate OpenAPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - name: Extract tool versions from mise.toml
        id: versions
        run: |
          # Extract spectral version from mise.toml
          SPECTRAL_VERSION=$(grep 'spectral' mise.toml | sed 's/.*= "\(.*\)".*/\1/')
          echo "spectral=${SPECTRAL_VERSION}" >> $GITHUB_OUTPUT
          echo "✓ Extracted versions: spectral=${SPECTRAL_VERSION}"

      - uses: stoplightio/spectral-action@latest
        with:
          file_glob: "docs/swagger.yaml"
          spectral-version: ${{ steps.versions.outputs.spectral }}

      - name: Upload OpenAPI spec as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-spec
          path: |
            docs/swagger.json
            docs/swagger.yaml
            docs/docs.go
          retention-days: 30
