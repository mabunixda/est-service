---
name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'workflow_run' 
        && github.event.workflow_run.conclusion == 'success' 
        && github.event.workflow_run.head_branch == 'main')


  kubernetes-manifests:
    name: Package Kubernetes Manifests
    runs-on: ubuntu-latest
    needs:
      - goreleaser

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          # If we were triggered by a tag push, use GITHUB_REF
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Otherwise (workflow_run) fetch tags and pick the most recent tag
          git fetch --tags --force
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || git tag --sort=-creatordate | head -n1)
          if [ -z "$TAG" ]; then
            echo "VERSION=unknown" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT
          fi

      - name: Update Kustomization
        run: |
          cd deployments/kubernetes
          # Update image tag in kustomization.yaml
          sed -i "s/newTag: .*/newTag: v${{ steps.version.outputs.VERSION }}/" kustomization.yaml

      - name: Create manifests archive
        run: |
          tar -czf kubernetes-manifests-${{ steps.version.outputs.VERSION }}.tar.gz -C deployments/kubernetes .

      - name: Upload manifests to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: kubernetes-manifests-${{ steps.version.outputs.VERSION }}.tar.gz
          tag_name: ${{ steps.version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true     
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}