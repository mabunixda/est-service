---
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'workflow_run' 
        && github.event.workflow_run.conclusion == 'success' 
        && github.event.workflow_run.head_branch == 'main')
    name: GoReleaser
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Setup tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  kubernetes-manifests:
    name: Package Kubernetes Manifests
    runs-on: ubuntu-latest
    needs:
      - goreleaser

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          # If we were triggered by a tag push, use GITHUB_REF
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Otherwise (workflow_run) fetch tags and pick the most recent tag
          git fetch --tags --force
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || git tag --sort=-creatordate | head -n1)
          if [ -z "$TAG" ]; then
            echo "VERSION=unknown" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT
          fi

      - name: Update Kustomization
        run: |
          cd deployments/kubernetes
          # Update image tag in kustomization.yaml
          sed -i "s/newTag: .*/newTag: v${{ steps.version.outputs.VERSION }}/" kustomization.yaml

      - name: Create manifests archive
        run: |
          tar -czf kubernetes-manifests-${{ steps.version.outputs.VERSION }}.tar.gz -C deployments/kubernetes .

      - name: Upload manifests to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: kubernetes-manifests-${{ steps.version.outputs.VERSION }}.tar.gz
          tag_name: ${{ steps.version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true     
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}