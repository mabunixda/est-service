basePath: /
definitions:
  pkg_server.BackendHealthDetail:
    properties:
      address:
        description: Backend address
        type: string
      cluster_id:
        type: string
      cluster_name:
        type: string
      initialized:
        description: Whether backend is initialized
        type: boolean
      replication_dr:
        type: string
      replication_performance:
        type: string
      response_time:
        description: Backend response time
        type: string
      sealed:
        description: Whether backend is sealed
        type: boolean
      status:
        description: '"healthy", "degraded", "unhealthy"'
        type: string
      type:
        description: '"vault" or "openbao"'
        type: string
      version:
        description: Backend version
        type: string
    type: object
  pkg_server.DeepHealthResponse:
    properties:
      backend:
        allOf:
        - $ref: '#/definitions/pkg_server.BackendHealthDetail'
        description: Backend detailed health
      rate_limiter:
        allOf:
        - $ref: '#/definitions/pkg_server.RateLimiterHealth'
        description: Rate limiter status
      status:
        description: 'Overall status: "healthy", "degraded", "unhealthy"'
        type: string
      timestamp:
        description: ISO 8601 timestamp
        type: string
      tls_certificate:
        $ref: '#/definitions/pkg_server.TLSCertInfo'
      uptime:
        description: Service uptime duration
        type: string
      version:
        description: Application version (if available)
        type: string
    type: object
  pkg_server.HealthResponse:
    properties:
      backend:
        type: string
      status:
        type: string
      timestamp:
        type: string
      tls_certificate:
        $ref: '#/definitions/pkg_server.TLSCertInfo'
    type: object
  pkg_server.RateLimiterHealth:
    properties:
      auth_limit:
        description: Requests per second for auth endpoints
        type: integer
      burst_auth:
        description: Burst size for auth endpoints
        type: integer
      burst_general:
        description: Burst size for general endpoints
        type: integer
      enabled:
        type: boolean
      general_limit:
        description: Requests per second for general endpoints
        type: integer
    type: object
  pkg_server.TLSCertInfo:
    properties:
      days_remaining:
        type: integer
      expires_at:
        type: string
      status:
        description: '"ok", "warning", "critical", "expired"'
        type: string
      subject:
        type: string
    type: object
host: localhost:8443
info:
  contact:
    name: EST Service
    url: https://github.com/mabunixda/est-service
  description: |-
    Enrollment over Secure Transport (EST) Service implementing RFC 7030.
    This service provides a standards-compliant EST implementation that uses OpenBao or HashiCorp Vault as the backend PKI system.

    **Authentication Methods:**
    - HTTP Basic Auth (mapped to backend userpass, LDAP, or AppRole)
    - TLS Client Certificates (mapped to backend cert auth)
    - Bearer Token (backend token authentication)
  license:
    name: MPL-2.0
    url: https://www.mozilla.org/en-US/MPL/2.0/
  title: EST Service API
  version: 1.0.0
paths:
  /.well-known/est/cacerts:
    get:
      description: Retrieve the current CA certificate(s) used by the EST server.
        Returns a PKCS#7 certs-only structure containing one or more certificates.
      produces:
      - application/pkcs7-mime
      responses:
        "200":
          description: CA certificates in base64-encoded PKCS#7 format
          schema:
            type: string
        "500":
          description: Failed to retrieve CA certificates
          schema:
            type: string
      summary: Get CA certificates
      tags:
      - EST
  /.well-known/est/simpleenroll:
    post:
      consumes:
      - application/pkcs10
      description: Submit a Certificate Signing Request (CSR) to receive a signed
        certificate. Requires authentication via Basic Auth, TLS client certificate,
        or Bearer token.
      parameters:
      - description: Base64-encoded PKCS#10 Certificate Signing Request
        in: body
        name: body
        required: true
        schema:
          type: string
      produces:
      - application/pkcs7-mime
      responses:
        "200":
          description: Signed certificate in base64-encoded PKCS#7 format
          schema:
            type: string
        "400":
          description: Invalid CSR or CSR signature
          schema:
            type: string
        "401":
          description: Authentication required
          schema:
            type: string
        "500":
          description: Enrollment failed
          schema:
            type: string
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Enroll a new certificate
      tags:
      - EST
  /.well-known/est/simplereenroll:
    post:
      consumes:
      - application/pkcs10
      description: Submit a Certificate Signing Request (CSR) to renew an existing
        certificate. Requires authentication and optionally validates that the CSR
        matches the client certificate.
      parameters:
      - description: Base64-encoded PKCS#10 Certificate Signing Request
        in: body
        name: body
        required: true
        schema:
          type: string
      produces:
      - application/pkcs7-mime
      responses:
        "200":
          description: Renewed certificate in base64-encoded PKCS#7 format
          schema:
            type: string
        "400":
          description: Invalid CSR, CSR signature, or CSR does not match client certificate
          schema:
            type: string
        "401":
          description: Authentication required
          schema:
            type: string
        "500":
          description: Reenrollment failed
          schema:
            type: string
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Reenroll an existing certificate
      tags:
      - EST
  /health:
    get:
      description: Check if the service and backend are healthy and operational
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy
          schema:
            $ref: '#/definitions/pkg_server.HealthResponse'
        "503":
          description: Service or backend unavailable
          schema:
            type: string
      summary: Health check
      tags:
      - Health
  /health/deep:
    get:
      description: Get detailed health information including backend status, TLS certificate
        info, and system metrics
      produces:
      - application/json
      responses:
        "200":
          description: Detailed health information
          schema:
            $ref: '#/definitions/pkg_server.DeepHealthResponse'
        "503":
          description: Service degraded or unhealthy
          schema:
            $ref: '#/definitions/pkg_server.DeepHealthResponse'
      security:
      - BearerAuth: []
      summary: Deep health check
      tags:
      - Health
  /ready:
    get:
      description: Check if the service is ready to accept requests (includes backend
        connectivity check)
      produces:
      - application/json
      responses:
        "200":
          description: Service is ready
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service not ready
          schema:
            type: string
      summary: Readiness check
      tags:
      - Health
schemes:
- https
- http
securityDefinitions:
  BasicAuth:
    type: basic
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: EST protocol endpoints (RFC 7030)
  name: EST
- description: Health and readiness checks
  name: Health
- description: Observability endpoints
  name: Metrics
