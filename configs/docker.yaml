# EST Service Docker Configuration
# Optimized for containerized deployment with OpenBao

server:
  listen_address: "0.0.0.0:8443"
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  rate_limit:
    enabled: true
    requests_per_second: 100
    burst: 200
  tls:
    cert_file: "/etc/est/certs/server.crt"
    key_file: "/etc/est/certs/server.key"
    client_ca_file: "/etc/est/certs/client-ca.crt"
    client_auth_type: "request"

# Backend: OpenBao in Docker
backend:
  type: "openbao"
  address: "${OPENBAO_ADDR}"
  timeout: 30s

est:
  enabled: true
  default_mount: "pki"

  labels:
    devices:
      type: "role"
      value: "device-cert"

  default_policy:
    type: "role"
    value: "est-devices"
    ttl: "24h" # 1 day for docker deployments

  # Use authenticated user's token for OpenBao operations (recommended for production)
  # When true: OpenBao audit logs show actual user identity and enforce per-user policies
  # When false: All requests use EST service token (simpler but less secure)
  use_authenticated_token: true

  authenticators:
    userpass:
      enabled: true
      mount_path: "userpass"
    ldap:
      enabled: false
      mount_path: "ldap"
    approle:
      enabled: false
      mount_path: "approle"
    cert:
      enabled: true
      mount_path: "cert"
      cert_role: ""
    token:
      enabled: true

  csr_validation:
    max_size_bytes: 65536
    allowed_signature_algorithms:
      - "SHA256WithRSA"
      - "SHA384WithRSA"
      - "SHA512WithRSA"
      - "ECDSAWithSHA256"
      - "ECDSAWithSHA384"
      - "ECDSAWithSHA512"

  # Server-side key generation (RFC 7030 Section 4.4)
  # WARNING: Disabled by default for security - transmits private keys over network
  # Only enable if client-side key generation is not feasible
  server_key_gen:
    enabled: false # MUST be false unless specifically required
    encrypt_private_key: true # REQUIRED if enabled: encrypts private keys
    default_key_type: "rsa" # rsa or ecdsa
    default_key_size: 2048 # RSA: 2048, 3072, 4096; ECDSA: 256, 384, 521
    max_csr_size: 4096 # Maximum CSR size for serverkeygen requests
    use_auth_token: true # Use authenticated token for PKI operations

observability:
  metrics:
    enabled: true
    prometheus_port: 9090
  logging:
    level: "info"
    format: "json"
