# EST Service Configuration - HashiCorp Vault Backend Example
# This example shows how to configure est-service with HashiCorp Vault
# TLS is required by default. Use developer_mode: true only for local testing.

# developer_mode: false  # Default: false (TLS required)

server:
  listen_address: "0.0.0.0:8443"
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  rate_limit:
    enabled: true
    requests_per_second: 100
    burst: 200
  tls:
    cert_file: "/etc/est/server.crt"
    key_file: "/etc/est/server.key"
    client_ca_file: "/etc/est/client-ca.crt"
    client_auth_type: "request" # none, request, require

# Backend configuration for HashiCorp Vault
backend:
  type: "vault" # Optional: auto-detected
  address: "https://vault.example.com:8200"
  namespace: "admin" # Vault Enterprise namespaces
  tls_skip_verify: false
  ca_cert: "/etc/vault/ca.crt"
  timeout: 30s

est:
  enabled: true
  default_mount: "pki"

  labels:
    devices:
      type: "role"
      value: "device-cert"
    users:
      type: "role"
      value: "user-cert"
    servers:
      type: "sign-verbatim"

  default_policy:
    type: "role"
    value: "default-est"
    ttl: "720h" # 30 days

  authenticators:
    userpass:
      enabled: true
      mount_path: "userpass"
    ldap:
      enabled: false
      mount_path: "ldap"
    approle:
      enabled: false
      mount_path: "approle"
    cert:
      enabled: true
      mount_path: "cert"
      cert_role: "est-client"
    token:
      enabled: true

  csr_validation:
    max_size_bytes: 65536
    allowed_signature_algorithms:
      - "SHA256WithRSA"
      - "SHA384WithRSA"
      - "SHA512WithRSA"
      - "ECDSAWithSHA256"
      - "ECDSAWithSHA384"
      - "ECDSAWithSHA512"

  # Server-side key generation (RFC 7030 Section 4.4)
  # WARNING: Disabled by default for security - transmits private keys over network
  # Only enable if client-side key generation is not feasible
  server_key_gen:
    enabled: false # MUST be false unless specifically required
    encrypt_private_key: true # REQUIRED if enabled: encrypts private keys
    default_key_type: "rsa" # rsa or ecdsa
    default_key_size: 2048 # RSA: 2048, 3072, 4096; ECDSA: 256, 384, 521
    max_csr_size: 4096 # Maximum CSR size for serverkeygen requests
    use_auth_token: true # Use authenticated token for PKI operations

observability:
  metrics:
    enabled: true
    prometheus_port: 9090
    otlp_endpoint: ""
  logging:
    level: "info"
    format: "json"
