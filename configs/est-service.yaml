# EST Service Production Configuration - OpenBao Backend
# TLS is required by default. Use developer_mode: true only for local testing.

# developer_mode: false  # Default: false (TLS required)

server:
  listen_address: "0.0.0.0:8443"
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  # Require authentication for /metrics and /swagger (default: true in production)
  internal_endpoints_auth: true
  rate_limit:
    enabled: true
    requests_per_second: 100 # Per IP address (general endpoints)
    burst: 200
    # Stricter limits for auth endpoints (simpleenroll, simplereenroll)
    # Prevents brute force attacks
    auth_requests_per_second: 10 # Default: 10 (applied when rate_limit.enabled: true)
    auth_burst: 5 # Default: 5
    # Only trust X-Forwarded-For from these proxy CIDRs
    trusted_proxy_cidrs: []
  tls:
    cert_file: "/etc/est/server.crt"
    key_file: "/etc/est/server.key"
    client_ca_file: "/etc/est/client-ca.crt"
    client_auth_type: "request" # none, request, require

# Backend configuration (supports OpenBao)
# Type: "openbao"
#   - Explicit type (recommended): faster startup, no version detection needed
#   - "auto" or omit: automatically detects from backend version endpoint
# The service will log the detected/configured backend type on startup
backend:
  type: "openbao" # Recommended: explicit type for production
  address: "https://openbao:8200"
  namespace: "" # Enterprise feature (OpenBao Enterprise)
  tls_skip_verify: false # Not recommended for production
  ca_cert: "/etc/openbao/ca.crt"
  timeout: 30s

est:
  enabled: true
  default_mount: "pki"

  labels:
    devices:
      type: "role"
      value: "device-cert"
      ttl: "720h" # 30 days
    users:
      type: "role"
      value: "user-cert"
      ttl: "168h" # 7 days
    servers:
      type: "sign-verbatim"
      ttl: "8760h" # 1 year

  default_policy:
    type: "role"
    value: "default-est"
    ttl: "720h" # 30 days

  authenticators:
    userpass:
      enabled: true
      mount_path: "userpass"
    ldap:
      enabled: false
      mount_path: "ldap"
    approle:
      enabled: false
      mount_path: "approle"
    cert:
      enabled: true
      mount_path: "cert"
      cert_role: "est-client"
      entity_alias_prefix: "est-cert-" # Optional: Prefix for entity names (default: "est-cert-")
      token_ttl: "24h" # Optional: Token TTL for cert-authenticated clients (default: "24h")
    token:
      enabled: true

  csr_validation:
    max_size_bytes: 65536
    allowed_signature_algorithms:
      - "SHA256WithRSA"
      - "SHA384WithRSA"
      - "SHA512WithRSA"
      - "ECDSAWithSHA256"
      - "ECDSAWithSHA384"
      - "ECDSAWithSHA512"

  # Server-side key generation (RFC 7030 Section 4.4)
  # WARNING: Disabled by default for security - transmits private keys over network
  # Only enable if client-side key generation is not feasible
  server_key_gen:
    enabled: false # MUST be false unless specifically required
    encrypt_private_key: true # REQUIRED if enabled: encrypts private keys
    default_key_type: "rsa" # rsa or ecdsa
    default_key_size: 2048 # RSA: 2048, 3072, 4096; ECDSA: 256, 384, 521
    max_csr_size: 4096 # Maximum CSR size for serverkeygen requests
    use_auth_token: true # Use authenticated token for PKI operations
    
    # Optional: Use OpenBao Transit engine for secure key generation
    # When enabled, keys are generated in OpenBao's secure environment
    # Benefits: HSM support, audit trail, key never persists in EST service
    use_openbao_transit: false # Set to true to enable Transit key generation
    transit_mount: "transit" # Transit engine mount path (default: "transit")
    # transit_key_name_prefix: "temp-keygen-" # Optional prefix for Transit key names

observability:
  metrics:
    enabled: true
    prometheus_port: 9090 # Prometheus scraping endpoint on :9090/metrics
    otlp_endpoint: "" # Optional: OTLP collector endpoint (e.g., "localhost:4318")
    otlp_insecure: false # Set true only for local/dev OTLP collectors
  logging:
    level: "info"
    format: "json"
    stdout: true
    file: "" # Optional log file path
  audit:
    enabled: true
    stdout: true
    file: "" # Optional audit log file path
